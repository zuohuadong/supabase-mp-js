name: Export Code Quality Findings

on:
  push:
    branches:
      - codex/fix-code-quality-20260818
    paths:
      - .github/workflows/code-quality-findings.yml
  workflow_dispatch:

permissions:
  contents: write
  code-quality: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Fetch open code quality findings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --output "$response" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-quality/findings?state=open&per_page=100")"

          python3 - "$response" "$status" > .github/code-quality-findings.json <<'PY'
          import json
          import pathlib
          import sys

          response_path = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          text = response_path.read_text(encoding="utf-8")
          try:
              body = json.loads(text)
          except json.JSONDecodeError:
              body = text

          print(json.dumps({"http_status": status, "body": body}, ensure_ascii=False, indent=2))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/code-quality-findings.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: capture code quality findings'
            git push
          fi

          test "$status" = '200'
